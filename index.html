<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherVoice Capsule</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Aqua Voice Style Floating Draggable Bubble with Glass Button Spec -->
    <div class="glass-button-wrap" data-tauri-drag-region>
      <div class="aqua-bubble glass-button idle" id="capsule" data-tauri-drag-region>
        <!-- Left dismiss / minimize button -->
        <button class="bubble-action-btn dismiss-btn" id="dismiss-btn" title="Hide Bubble">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

      <!-- Center Audio / State Region (Draggable) -->
      <div class="bubble-center" data-tauri-drag-region>
        <!-- AetherVoice Branding Icon -->
        <img src="/src/assets/logo.png" class="capsule-logo" id="capsule-logo" alt="AetherVoice" data-tauri-drag-region />

        <!-- Waveform visualizer bars -->
        <div class="waveform" id="waveform" data-tauri-drag-region>
          <div class="bar bar-1"></div>
          <div class="bar bar-2"></div>
          <div class="bar bar-3"></div>
          <div class="bar bar-4"></div>
          <div class="bar bar-5"></div>
          <div class="bar bar-6"></div>
          <div class="bar bar-7"></div>
          <div class="bar bar-8"></div>
          <div class="bar bar-9"></div>
          <div class="bar bar-10"></div>
          <div class="bar bar-11"></div>
          <div class="bar bar-12"></div>
        </div>
      </div>

      <!-- Right stop / finish recording button -->
      <button class="bubble-action-btn stop-btn" id="stop-btn" title="Stop & Refine">
        <div class="stop-icon"></div>
      </button>

        <!-- Hidden settings trigger button -->
        <button id="settings-btn" style="display: none;"></button>
      </div>
      <div class="glass-button-shadow rounded-full" data-tauri-drag-region></div>
    </div>
  </body>
</html>
